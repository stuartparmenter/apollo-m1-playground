# WizMote Remote Control
# Enables WizMote remote support using ESPHome ESP-NOW with MAC filtering and page navigation
#
# Each button's action is remappable from Home Assistant via a "WizMote ..."
# select entity (config category) -- no YAML editing needed. Defaults match
# the original hardcoded mapping. "Send HA Event" fires esphome.wizmote_event
# with the button label in the payload.
#
# Required vars:
#   wizmote_page_1: Page ID for the "Show Page 1" action (default for button 1)
#   wizmote_page_2: Page ID for the "Show Page 2" action (default for button 2)
#   wizmote_page_3: Page ID for the "Show Page 3" action (default for button 3)
#   wizmote_page_4: Page ID for the "Show Page 4" action (default for button 4)

substitutions:
  # WizMote button mappings
  WIZMOTE_BUTTON_ON: "1"
  WIZMOTE_BUTTON_OFF: "2"
  WIZMOTE_BUTTON_NIGHT: "3"
  WIZMOTE_BUTTON_1: "16"
  WIZMOTE_BUTTON_2: "17"
  WIZMOTE_BUTTON_3: "18"
  WIZMOTE_BUTTON_4: "19"
  WIZMOTE_BUTTON_BRIGHT_UP: "9"
  WIZMOTE_BUTTON_BRIGHT_DOWN: "8"

  # Default WizMote MAC address
  WIZMOTE_MAC_ADDRESS: "00:00:00:00:00:00"

  # Brightness control settings
  WIZMOTE_BRIGHTNESS_STEP: "10"  # Percentage step for brightness changes
  WIZMOTE_BRIGHTNESS_MIN_STEP: "5"  # Minimum step in actual values
  WIZMOTE_BRIGHTNESS_NIGHT: "20"  # Default night setting

  # Debounce settings
  WIZMOTE_DEBOUNCE_MS: "200"  # Debounce timeout in milliseconds

# Globals for duplicate detection and MAC tracking
globals:
  - id: wizmote_last_sequence
    type: int
    initial_value: '0'
  - id: wizmote_previous_mac
    type: std::string
    initial_value: '""'

# One dropdown per WizMote button. Change these in Home Assistant to remap a
# button -- no YAML editing. "Send HA Event" fires esphome.wizmote_event with
# the button label in the payload so you can wire it to anything in HA.
# Defaults match the previous hardcoded behavior.
select:
  - platform: template
    name: "WizMote On"
    id: wizmote_action_on
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Display On"
    options: &wizmote_actions
      - "Nothing"
      - "Show Page 1"
      - "Show Page 2"
      - "Show Page 3"
      - "Show Page 4"
      - "Next Page"
      - "Previous Page"
      - "Display On"
      - "Display Off"
      - "Display Toggle"
      - "Brightness Up"
      - "Brightness Down"
      - "Night Mode"
      - "Send HA Event"
  - platform: template
    name: "WizMote Off"
    id: wizmote_action_off
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Display Off"
    options: *wizmote_actions
  - platform: template
    name: "WizMote Night"
    id: wizmote_action_night
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Night Mode"
    options: *wizmote_actions
  - platform: template
    name: "WizMote Brightness Up"
    id: wizmote_action_bright_up
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Brightness Up"
    options: *wizmote_actions
  - platform: template
    name: "WizMote Brightness Down"
    id: wizmote_action_bright_down
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Brightness Down"
    options: *wizmote_actions
  - platform: template
    name: "WizMote Button 1"
    id: wizmote_action_btn1
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Show Page 1"
    options: *wizmote_actions
  - platform: template
    name: "WizMote Button 2"
    id: wizmote_action_btn2
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Show Page 2"
    options: *wizmote_actions
  - platform: template
    name: "WizMote Button 3"
    id: wizmote_action_btn3
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Show Page 3"
    options: *wizmote_actions
  - platform: template
    name: "WizMote Button 4"
    id: wizmote_action_btn4
    icon: "mdi:gesture-tap-button"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Show Page 4"
    options: *wizmote_actions

# Scripts to process WizMote button actions
script:
  # Run one action. `action` is the chosen menu string; `button` is the label
  # used in the HA event payload when the action is "Send HA Event".
  - id: run_wizmote_action
    parameters:
      action: string
      button: string
    then:
      - logger.log:
          tag: wizmote
          format: "button %s -> %s"
          args: ['button.c_str()', 'action.c_str()']
      - if:
          condition:
            lambda: 'return action == "Show Page 1";'
          then:
            - lvgl_page_manager.page.show:
                page: ${wizmote_page_1}
      - if:
          condition:
            lambda: 'return action == "Show Page 2";'
          then:
            - lvgl_page_manager.page.show:
                page: ${wizmote_page_2}
      - if:
          condition:
            lambda: 'return action == "Show Page 3";'
          then:
            - lvgl_page_manager.page.show:
                page: ${wizmote_page_3}
      - if:
          condition:
            lambda: 'return action == "Show Page 4";'
          then:
            - lvgl_page_manager.page.show:
                page: ${wizmote_page_4}
      - if:
          condition:
            lambda: 'return action == "Next Page";'
          then:
            - lvgl_page_manager.page.next: {}
      - if:
          condition:
            lambda: 'return action == "Previous Page";'
          then:
            - lvgl_page_manager.page.previous: {}
      - if:
          condition:
            lambda: 'return action == "Display On";'
          then:
            - switch.turn_on: power
      - if:
          condition:
            lambda: 'return action == "Display Off";'
          then:
            - switch.turn_off: power
      - if:
          condition:
            lambda: 'return action == "Display Toggle";'
          then:
            - switch.toggle: power
      - if:
          condition:
            lambda: 'return action == "Brightness Up";'
          then:
            - lambda: |-
                float current = id(brightness).state;
                float step_percent = ${WIZMOTE_BRIGHTNESS_STEP} / 100.0f;
                float min_step = ${WIZMOTE_BRIGHTNESS_MIN_STEP};
                int new_brightness = static_cast<int>(std::min(255.0f, current + std::max(min_step, 255.0f * step_percent)));
                auto call = id(brightness).make_call();
                call.set_value(new_brightness);
                call.perform();
                ESP_LOGI("wizmote", "Brightness increased: %.0f -> %d", current, new_brightness);
      - if:
          condition:
            lambda: 'return action == "Brightness Down";'
          then:
            - lambda: |-
                float current = id(brightness).state;
                float step_percent = ${WIZMOTE_BRIGHTNESS_STEP} / 100.0f;
                float min_step = ${WIZMOTE_BRIGHTNESS_MIN_STEP};
                int new_brightness = static_cast<int>(std::max(1.0f, current - std::max(min_step, 255.0f * step_percent)));
                auto call = id(brightness).make_call();
                call.set_value(new_brightness);
                call.perform();
                ESP_LOGI("wizmote", "Brightness decreased: %.0f -> %d", current, new_brightness);
      - if:
          condition:
            lambda: 'return action == "Night Mode";'
          then:
            - lambda: |-
                auto call = id(brightness).make_call();
                call.set_value(${WIZMOTE_BRIGHTNESS_NIGHT});
                call.perform();
                ESP_LOGI("wizmote", "Night mode: brightness set to %d", ${WIZMOTE_BRIGHTNESS_NIGHT});
      - if:
          condition:
            lambda: 'return action == "Send HA Event";'
          then:
            - homeassistant.event:
                event: esphome.wizmote_event
                data:
                  button: !lambda 'return button;'

  # Look up the configured action for the pressed button, then run it.
  - id: process_wizmote_button
    parameters:
      button: int
    then:
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_ON};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_on).current_option();'
                button: "on"
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_OFF};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_off).current_option();'
                button: "off"
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_NIGHT};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_night).current_option();'
                button: "night"
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_BRIGHT_UP};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_bright_up).current_option();'
                button: "brightness_up"
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_BRIGHT_DOWN};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_bright_down).current_option();'
                button: "brightness_down"
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_1};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_btn1).current_option();'
                button: "1"
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_2};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_btn2).current_option();'
                button: "2"
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_3};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_btn3).current_option();'
                button: "3"
      - if:
          condition:
            lambda: 'return button == ${WIZMOTE_BUTTON_4};'
          then:
            - script.execute:
                id: run_wizmote_action
                action: !lambda 'return id(wizmote_action_btn4).current_option();'
                button: "4"
      - if:
          condition:
            lambda: |-
              return button != ${WIZMOTE_BUTTON_ON} && button != ${WIZMOTE_BUTTON_OFF} &&
                     button != ${WIZMOTE_BUTTON_NIGHT} && button != ${WIZMOTE_BUTTON_BRIGHT_UP} &&
                     button != ${WIZMOTE_BUTTON_BRIGHT_DOWN} && button != ${WIZMOTE_BUTTON_1} &&
                     button != ${WIZMOTE_BUTTON_2} && button != ${WIZMOTE_BUTTON_3} &&
                     button != ${WIZMOTE_BUTTON_4};
          then:
            - logger.log:
                tag: wizmote
                level: WARN
                format: "unmapped button %d"
                args: ['button']

# ESP-NOW configuration for WizMote communication
espnow:
  id: espnow_component
  auto_add_peer: false
  enable_on_boot: true
  on_unknown_peer:
    then:
      - lambda: |-
          // Extract sender MAC from ESP-NOW info structure
          std::string sender_mac;
          char mac_str[18];
          snprintf(mac_str, sizeof(mac_str), "%02x:%02x:%02x:%02x:%02x:%02x",
                   info.src_addr[0], info.src_addr[1], info.src_addr[2],
                   info.src_addr[3], info.src_addr[4], info.src_addr[5]);
          sender_mac = std::string(mac_str);

          bool discovery_mode = id(wizmote_discovery_mode).state;

          ESP_LOGV("wizmote", "UNKNOWN PEER: Received ESP-NOW data from %s, length: %d",
                   sender_mac.c_str(), size);

          // WizMote protocol: expect 13 bytes
          if (size != 13) {
            ESP_LOGW("wizmote", "Unknown peer sent invalid packet size: %d", size);
            return;
          }

          uint8_t button = data[12];

          // Discovery mode: auto-discover and pair WizMotes
          if (discovery_mode) {
            ESP_LOGW("wizmote", "🔍 DISCOVERY: WizMote MAC: %s, Button: %d", sender_mac.c_str(), button);

            // Auto-set MAC address and pair the WizMote
            std::string current_mac = id(wizmote_mac_address).state;
            if (current_mac == "00:00:00:00:00:00" || current_mac == "" || current_mac != sender_mac) {
              ESP_LOGI("wizmote", "🔄 Auto-setting discovered WizMote MAC: %s", sender_mac.c_str());
              auto call = id(wizmote_mac_address).make_call();
              call.set_value(sender_mac);
              call.perform();

              // Turn off discovery mode
              id(wizmote_discovery_mode).turn_off();
              ESP_LOGI("wizmote", "✅ WizMote auto-discovered! Pairing handled by MAC address update.");
            }
            return;
          }

          ESP_LOGI("wizmote", "🔍 UNKNOWN WizMote: MAC: %s, Button: %d (enable discovery mode to pair)", sender_mac.c_str(), button);

  on_broadcast:
    then:
      - lambda: |-
          // Extract sender MAC from ESP-NOW info structure
          std::string sender_mac;
          char mac_str[18];
          snprintf(mac_str, sizeof(mac_str), "%02x:%02x:%02x:%02x:%02x:%02x",
                   info.src_addr[0], info.src_addr[1], info.src_addr[2],
                   info.src_addr[3], info.src_addr[4], info.src_addr[5]);
          sender_mac = std::string(mac_str);

          // Check if this is a WizMote message and from our paired device
          if (size == 13) {
            std::string configured_mac = id(wizmote_mac_address).state;

            // Convert configured MAC to lowercase for comparison
            std::transform(configured_mac.begin(), configured_mac.end(), configured_mac.begin(), ::tolower);

            if (configured_mac != "00:00:00:00:00:00" && configured_mac != "" && sender_mac == configured_mac) {
              ESP_LOGV("wizmote", "Processing WizMote broadcast from paired device %s", sender_mac.c_str());

              // data[0] -> packet.program
              // data[1-4] -> packet.sequence (32-bit little endian)
              // data[5] -> packet.data_type_1 (should be 32)
              // data[6] -> packet.button
              // data[7] -> packet.data_type_2 (should be 1)
              // data[8] -> packet.battery
              // data[9-12] -> packet.ccm_mac

              uint8_t program = data[0];
              uint32_t sequence = (data[4] << 24) | (data[3] << 16) | (data[2] << 8) | data[1];
              uint8_t data_type_1 = data[5];
              uint8_t button = data[6];
              uint8_t data_type_2 = data[7];
              uint8_t battery = data[8];

              ESP_LOGV("wizmote", "WizMote structure: program=0x%02x, seq=%d, dt1=%d, button=%d, dt2=%d, battery=%d",
                       program, sequence, data_type_1, button, data_type_2, battery);

              ESP_LOGV("wizmote", "WizMote packet dump: [%02x %02x %02x %02x %02x %02x %02x %02x %02x %02x %02x %02x %02x]",
                       data[0], data[1], data[2], data[3], data[4], data[5], data[6],
                       data[7], data[8], data[9], data[10], data[11], data[12]);

              // Sequence-based duplicate detection
              int last_sequence = id(wizmote_last_sequence);
              if (sequence == last_sequence) {
                ESP_LOGV("wizmote", "Duplicate WizMote packet (sequence: %d, button: %d)", sequence, button);
                return;
              }

              // Update sequence tracking
              id(wizmote_last_sequence) = sequence;

              ESP_LOGI("wizmote", "WizMote button pressed: %d seq=%d (from paired broadcast %s)", button, sequence, sender_mac.c_str());

              id(process_wizmote_button).execute(button);
            } else {
              ESP_LOGV("wizmote", "WizMote broadcast from non-paired device: %s (configured: %s)",
                       sender_mac.c_str(), configured_mac.c_str());
            }
          } else {
            ESP_LOGV("wizmote", "ESP-NOW broadcast (non-WizMote, length: %d)", size);
          }


# WizMote pairing is automatically restored on boot

# Template text entity for MAC address pairing
text:
  - platform: template
    name: "WizMote MAC Address"
    id: wizmote_mac_address
    icon: "mdi:remote"
    entity_category: config
    initial_value: "${WIZMOTE_MAC_ADDRESS}"
    optimistic: true
    restore_value: true
    mode: text
    min_length: 17
    max_length: 17
    on_value:
      - lambda: |-
          // Validate MAC address format (length enforced by min/max_length)
          std::string mac = x;

          bool valid_format = true;
          for (int i = 0; i < 17; i++) {
            if (i % 3 == 2) {
              if (mac[i] != ':') {
                valid_format = false;
                break;
              }
            } else {
              if (!std::isxdigit(mac[i])) {
                valid_format = false;
                break;
              }
            }
          }

          if (valid_format) {
            ESP_LOGI("wizmote", "WizMote MAC address updated: %s", mac.c_str());
          } else {
            ESP_LOGW("wizmote", "Invalid MAC address format: %s (should be aa:bb:cc:dd:ee:ff)", mac.c_str());
            return;
          }

      # Remove old MAC if it exists
      - if:
          condition:
            lambda: 'return (id(wizmote_previous_mac) != "" && id(wizmote_previous_mac) != "00:00:00:00:00:00");'
          then:
            - espnow.peer.delete:
                address: !lambda |-
                  std::string mac = id(wizmote_previous_mac);
                  std::array<uint8_t, 6> mac_bytes;
                  sscanf(mac.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                         &mac_bytes[0], &mac_bytes[1], &mac_bytes[2],
                         &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                  return mac_bytes;
            - logger.log:
                format: "Removed old WizMote pairing: %s"
                args: ['id(wizmote_previous_mac).c_str()']

      # Add new MAC if it's valid
      - if:
          condition:
            lambda: 'return (x != "00:00:00:00:00:00" && x != "");'
          then:
            - espnow.peer.add:
                address: !lambda |-
                  std::string mac = x;
                  std::array<uint8_t, 6> mac_bytes;
                  sscanf(mac.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                         &mac_bytes[0], &mac_bytes[1], &mac_bytes[2],
                         &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                  return mac_bytes;
            - logger.log:
                format: "✅ WizMote paired: %s"
                args: ['x.c_str()']

      # Update previous MAC tracker
      - lambda: 'id(wizmote_previous_mac) = x;'
      # Update status sensor when MAC changes
      - lambda: 'id(wizmote_status).update();'


# Manual control buttons
button:
  - platform: template
    name: "Clear WizMote Pairing"
    id: wizmote_clear_button
    icon: "mdi:close-circle"
    entity_category: config
    on_press:
      - lambda: |-
          std::string mac = id(wizmote_mac_address).state;
          if (mac != "00:00:00:00:00:00" && mac != "" && mac.length() == 17) {
            std::array<uint8_t, 6> mac_bytes;
            int parsed = sscanf(mac.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                               &mac_bytes[0], &mac_bytes[1], &mac_bytes[2],
                               &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);

            if (parsed == 6) {
              id(espnow_component).del_peer(mac_bytes.data());
              ESP_LOGI("wizmote", "WizMote unpaired: %s", mac.c_str());
            }
          }

          id(wizmote_mac_address).publish_state("00:00:00:00:00:00");
          ESP_LOGI("wizmote", "✅ WizMote pairing cleared");
      # Update status sensor when pairing is cleared
      - lambda: 'id(wizmote_status).update();'


# Boot pairing restoration
esphome:
  on_boot:
    - priority: -200
      then:
        - delay: 2s
        - if:
            condition:
              lambda: |-
                std::string mac = id(wizmote_mac_address).state;
                return (mac != "00:00:00:00:00:00" && mac != "");
            then:
              - logger.log: "Restoring WizMote pairing on boot..."
              - espnow.peer.add:
                  address: !lambda |-
                    std::string mac = id(wizmote_mac_address).state;
                    std::array<uint8_t, 6> mac_bytes;
                    sscanf(mac.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                           &mac_bytes[0], &mac_bytes[1], &mac_bytes[2],
                           &mac_bytes[3], &mac_bytes[4], &mac_bytes[5]);
                    return mac_bytes;
              - logger.log:
                  format: "✅ WizMote pairing restored: %s"
                  args: ['id(wizmote_mac_address).state.c_str()']

# Auto-discovery mode - turn on, press any WizMote button, get auto-paired!
switch:
  - platform: template
    name: "WizMote Auto-Discovery"
    id: wizmote_discovery_mode
    icon: "mdi:radar"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(wizmote_status).update();'
    on_turn_off:
      - lambda: 'id(wizmote_status).update();'

# Status display
text_sensor:
  - platform: template
    name: "WizMote Status"
    id: wizmote_status
    icon: "mdi:information"
    entity_category: diagnostic
    lambda: |-
      std::string mac = id(wizmote_mac_address).state;
      bool discovery = id(wizmote_discovery_mode).state;

      if (discovery) {
        return std::string("🔍 Discovery mode: Press any WizMote button");
      } else if (mac == "00:00:00:00:00:00" || mac == "") {
        return std::string("❌ No WizMote paired");
      } else {
        return std::string("✅ Paired: " + mac);
      }
    update_interval: 300s
